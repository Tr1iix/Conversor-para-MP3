<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conversor de Áudio para MP3 — grátis e ilimitado</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7fb;--card:#fff;--tx:#14161f;--mut:#6b7080;--bd:#e1e4ee;--ac:#5b5bf0;--ac2:#fff;--ok:#16a34a;--er:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1117;--card:#181b24;--tx:#eef0f7;--mut:#8b90a3;--bd:#2a2e3b;--ac:#7c7cff;--ac2:#0f1117;--ok:#4ade80;--er:#f87171}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1117;--card:#181b24;--tx:#eef0f7;--mut:#8b90a3;--bd:#2a2e3b;--ac:#7c7cff;--ac2:#0f1117;--ok:#4ade80;--er:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:1.7rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 20px}
#drop{border:2px dashed var(--bd);background:var(--card);border-radius:16px;padding:36px 16px;text-align:center;cursor:pointer;transition:.15s}
#drop.over,#drop:hover{border-color:var(--ac)}
#drop b{display:block;font-size:1.1rem;margin-bottom:4px}
#drop span{color:var(--mut);font-size:.9rem}
.opts{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}
select,button{font:inherit;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px}
button{cursor:pointer}
button.p{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.info{flex:1;min-width:0}
.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.st{font-size:.85rem;color:var(--mut)}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .1s}
a.dl{background:var(--ok);color:var(--ac2);text-decoration:none;padding:8px 12px;border-radius:10px;font-weight:600;white-space:nowrap}
.priv{color:var(--mut);font-size:.85rem;margin-top:20px;text-align:center}
</style>
</head>
<body>
<main>
<h1>🎧 Converter para MP3</h1>
<p class="sub">Grátis, sem limite de arquivos e sem upload: tudo roda no seu navegador.</p>

<div id="drop"><b>Arraste os áudios aqui ou clique para escolher</b><span>M4A, AAC, WAV, OGG, FLAC, OPUS, WEBM, MP4… (depende do seu navegador)</span></div>
<input id="file" type="file" accept="audio/*,video/*,.m4a,.aac,.flac,.opus,.ogg,.wav,.wma,.amr,.aiff,.caf" multiple hidden>

<div class="opts">
  <label>Qualidade
    <select id="kbps"><option value="96">96 kbps (menor)</option><option value="128">128 kbps</option><option value="192" selected>192 kbps</option><option value="256">256 kbps</option><option value="320">320 kbps (máx.)</option></select>
  </label>
  <button class="p" id="go" disabled>Converter tudo</button>
  <button id="zip" disabled>Baixar ZIP</button>
  <button id="clr" disabled>Limpar</button>
</div>
<div id="list"></div>
<p class="priv">🔒 Seus arquivos nunca saem do seu dispositivo.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const drop=$('drop'),fi=$('file'),list=$('list'),go=$('go'),zipB=$('zip'),clr=$('clr');
let items=[],busy=false;

drop.onclick=()=>fi.click();
fi.onchange=()=>{add(fi.files);fi.value=''};
['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',ev=>add(ev.dataTransfer.files));

function add(files){
  for(const f of files){
    const el=document.createElement('div');el.className='item';
    el.innerHTML='<div class="info"><div class="name"></div><div class="st">Na fila</div><div class="bar"><i></i></div></div>';
    el.querySelector('.name').textContent=f.name;
    list.appendChild(el);
    items.push({f,el,blob:null,outName:f.name.replace(/\.[^.]+$/,'')+'.mp3'});
  }
  upd();
}
function upd(){
  go.disabled=busy||!items.some(i=>!i.blob);
  zipB.disabled=!items.some(i=>i.blob);
  clr.disabled=busy||!items.length;
}
clr.onclick=()=>{items=[];list.innerHTML='';upd()};

const tick=()=>new Promise(r=>setTimeout(r,0));

async function convert(it,kbps){
  const st=it.el.querySelector('.st'),bar=it.el.querySelector('.bar i');
  try{
    st.textContent='Decodificando…';
    const buf=await it.f.arrayBuffer();
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const ab=await new Promise((ok,no)=>ctx.decodeAudioData(buf,ok,no));
    ctx.close();
    const ch=Math.min(ab.numberOfChannels,2),sr=ab.sampleRate;
    const enc=new lamejs.Mp3Encoder(ch,sr,kbps);
    const to16=a=>{const o=new Int16Array(a.length);for(let i=0;i<a.length;i++){const s=Math.max(-1,Math.min(1,a[i]));o[i]=s<0?s*32768:s*32767}return o};
    const L=to16(ab.getChannelData(0)),R=ch>1?to16(ab.getChannelData(1)):null;
    const out=[],step=1152*32;
    st.textContent='Convertendo…';
    for(let i=0;i<L.length;i+=step){
      const b=ch>1?enc.encodeBuffer(L.subarray(i,i+step),R.subarray(i,i+step)):enc.encodeBuffer(L.subarray(i,i+step));
      if(b.length)out.push(b);
      bar.style.width=(i/L.length*100)+'%';
      if((i/step)%20===0)await tick();
    }
    const end=enc.flush();if(end.length)out.push(end);
    bar.style.width='100%';
    it.blob=new Blob(out,{type:'audio/mpeg'});
    st.textContent='Pronto · '+(it.blob.size/1048576).toFixed(2)+' MB';
    const a=document.createElement('a');a.className='dl';a.textContent='Baixar';
    a.href=URL.createObjectURL(it.blob);a.download=it.outName;
    it.el.appendChild(a);
  }catch(e){
    st.textContent='Erro: seu navegador não conseguiu ler este formato.';st.style.color='var(--er)';
  }
}

go.onclick=async()=>{
  busy=true;upd();
  const kbps=+$('kbps').value;
  for(const it of items)if(!it.blob&&!it.err)await convert(it,kbps);
  busy=false;upd();
};

zipB.onclick=async()=>{
  const z=new JSZip(),used={};
  for(const it of items)if(it.blob){
    let n=it.outName;if(used[n]){n=n.replace(/\.mp3$/,'')+'_'+used[n]+'.mp3'}
    used[it.outName]=(used[it.outName]||0)+1;
    z.file(n,it.blob);
  }
  const b=await z.generateAsync({type:'blob',compression:'STORE'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='audios-mp3.zip';a.click();
};
</script>
</body>
</html>
